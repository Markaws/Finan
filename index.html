[21.11.2026 11:33] Skip: <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Control</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:18px;color:#222}
main{max-width:650px;margin:auto}
h2{margin-top:8px}
textarea,input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px;margin:7px 0 14px}
textarea{height:230px;resize:vertical}
button{padding:13px 18px;border:0;border-radius:9px;background:#1769d2;color:white;font-size:16px;font-weight:bold;width:100%;margin:5px 0 15px}
.card{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
.result{font-size:18px;line-height:1.7}
.small{color:#666;font-size:13px}
.item{border-bottom:1px solid #eee;padding:8px 0}
.danger{color:#b00020}
</style>
</head>
<body>
<main>
<h2>Finance Control</h2>

<div class="card">
<label>Курс доллара (сум)</label>
<input id="rate" type="number" value="12000">

<label>Вставь текст рейса</label>
<textarea id="trip" placeholder="Рейс на 12.11 Четверг

Стики :342$
-6 TEREA Amber

Сигареты :57$
-1 Sobranie paradiso compact

Аппараты :390$
-2 One i оранжевый

Тотал :789$"></textarea>

<button onclick="calculate()">Рассчитать рейс</button>
<div id="result"></div>
</div><h3>Товары и тарифы</h3>
<div id="products">
<input id="productName" placeholder="Название товара">

<select id="productCategory">
<option value="sticks">Стики</option>
<option value="cigarettes">Сигареты</option>
<option value="devices">Аппараты</option>
</select>

<input id="productProfit" type="number" step="0.01" placeholder="Прибыль за единицу ($)">
<input id="productSale" type="number" step="0.01" placeholder="Цена продажи ($)">

<button onclick="addProduct()">Добавить товар</button>
</div>
</div>

<div class="card">
<h3>Финансовая статистика</h3>

<select id="statsPeriod" onchange="renderStats()">
  <option value="day">Сегодня</option>
  <option value="week">Эта неделя</option>
  <option value="month">Этот месяц</option>
  <option value="all">Всё время</option>
</select>

<div id="stats"></div>
</div>

<div class="card">
<h3>История рейсов</h3>
<div id="history"></div>
</div>
</main>

<script>
const KEY = "finance_control_history_v3";
const RATE_KEY = "finance_control_rate";
const PRODUCTS_KEY = "finance_control_products";

const tariffs = {
  TEREA: 11.20,
  HEETS: 9.37,
  "ONE I": 16.87,
  "MID I": 15.47,
  "PRIME I": 22.77,
  "SOBRANIE BLACK": 5.19,
  "SOBRANIE BLACK SLIMS": 8.09,
  "SOBRANIE PARADISO SLIMS": 10.48,
  "SOBRANIE PARADISO COMPACT": 7.98,
  "KENT MIX SLIMS": 13.20,
  "KENT MIX": 10.70,
  "WINSTONE CASTER": 13.61,
  "WINSTONE X-STYLE DUO": 6.80,
  "HARVEST SLIMS": 13.38,
  "HARVEST": 10.88,
  "PARLIAMENT": 6.30,
  "CHAPMAN": 19.28
};

document.getElementById("rate").value =
  localStorage.getItem(RATE_KEY) || "12000";

document.getElementById("rate").addEventListener("change", e => {
  localStorage.setItem(RATE_KEY, e.target.value);
});

function getHistory(){
  try {
    return JSON.parse(localStorage.getItem(KEY)) || [];
  } catch(e) {
    return [];
  }
}

function normalize(s){
  return s.toUpperCase().replaceAll("Ё","Е").replace(/\s+/g," ").trim();
}

function getProducts(){
  try {
    return JSON.parse(localStorage.getItem(PRODUCTS_KEY)) || [];
  } catch(e) {
    return [];
  }
}

function findTariff(category, description){
  const s = normalize(description);

  const custom = getProducts().find(p =>
    p.category === category &&
    s.includes(normalize(p.name))
  );

  if(custom){
    return [
      custom.name,
      Number(custom.profit),
      Number(custom.sale || 0)
    ];
  }

  if(category === "sticks"){
    if(/\bTEREA\b/.test(s)) return ["TEREA", tariffs.TEREA];
    if(/\bHEETS\b/.test(s)) return ["HEETS", tariffs.HEETS];
    return null;
  }

  if(category === "devices"){
    if(s.includes("PRIME I")) return ["PRIME I", tariffs["PRIME I"]];
    if(s.includes("MID I")) return ["MID I", tariffs["MID I"]];
    if(s.includes("ONE I")) return ["ONE I", tariffs["ONE I"]];
    return null;
  }

  if(category === "cigarettes"){
    const rules = [
      ["SOBRANIE PARADISO SLIMS", /SOBRANIE.*PARADISO.*SLIM/],
      ["SOBRANIE PARADISO COMPACT", /SOBRANIE.*PARADISO.*(COMPACT|THICK)/],
      ["SOBRANIE BLACK SLIMS", /SOBRANIE.*BLACK.*SLIM/],
      ["SOBRANIE BLACK", /SOBRANIE.*BLACK/],
      ["KENT MIX SLIMS", /KENT.*MIX.*SLIM/],
      ["KENT MIX", /KENT.*MIX/],
      ["WINSTONE X-STYLE DUO", /WINSTONE.*X.?STYLE.*DUO/],
      ["WINSTONE CASTER", /WINSTONE.*CASTER/],
      ["HARVEST SLIMS", /HARVEST.*SLIM/],
      ["HARVEST", /HARVEST/],
      ["PARLIAMENT", /PARLIAMENT/],
      ["CHAPMAN", /CHAPMAN/]
    ];

    for(const [name, regex] of rules){
      if(regex.test(s)) return [name, tariffs[name]];
    }
  }

  return null;
}

function parseTrip(raw){
  const lines = raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

  let category = null;
  let date = "Без даты";
  let saleTotal = null;
  let items = [];
  let errors = [];
  let categorySales = {};
  let profit = 0;
  let deviceSales = 0;

  for(const line of lines){

    if(/^РЕЙС/i.test(line)){
      date = line.replace(/^РЕЙС\s*/i,"").trim();
      continue;
    }

    if(/ТОТАЛ|TOTAL/i.test(line)){
      const m = line.match(/(\d+(?:[.,]\d+)?)\s*\$?/);
      if(m) saleTotal = Number(m[1].replace(",","."));
      continue;
    }

    const header = line.match(/^(СТИКИ|СИГАРЕТЫ|АППАРАТЫ)\s*[:\-]\s*(\d+(?:[.,]\d+)?)\s*\$?/i);

    if(header){
      const key = header[1].toUpperCase();

      category = key === "СТИКИ" ? "sticks" :
                 key === "СИГАРЕТЫ" ? "cigarettes" : "devices";

      categorySales[category] = Number(header[2].replace(",","."));
      continue;
    }

    if(line.startsWith("-") && category){
      const m = line.match(/^-\s*(\d+)\s+(.+)$/);

      if(!m){
        errors.push("Не удалось прочитать строку: " + line);
        continue;
      }

      const quantity = Number(m[1]);
      const description = m[2].trim();
      const found = findTariff(category, description);

      if(!found){
        errors.push("Не распознан товар: " + line);
        continue;
      }

      const itemProfit = quantity * found[1];

      if(category === "devices"){
        const unitSale = found[2] ?? ({
          "ONE I": 65,
          "MID I": 95,
          "PRIME I": 145
        }[found[0]] || 0);

        deviceSales += quantity * unitSale;
      }

      profit += itemProfit;

      items.push({
        quantity,
        description,
        product: found[0],
        unitProfit: found[1],
        profit: itemProfit
      });
    }
  }

  if(items.length === 0) errors.push("В рейсе не найдено ни одного товара.");
  if(saleTotal === null) errors.push("Не найдена строка Тотал.");

  const sectionsTotal = Object.values(categorySales).reduce((a,b)=>a+b,0);

  const totalSales = sectionsTotal;

  const deviceMismatch =
    Math.abs((categorySales.devices || 0) - deviceSales) > 0.01;

  const mismatch = saleTotal !== null &&
    Object.keys(categorySales).length > 0 &&
    Math.abs(totalSales-saleTotal) > 0.01;

  return {
    date,
    saleTotal,
    totalSales,
    categorySales,
    sectionsTotal,
    items,
    profit,
    deviceSales,
    deviceMismatch,
    errors,
    mismatch
  };
}

function money(n){
  return Number(n).toFixed(2) + "$";
}

function calculate(){
  const raw = document.getElementById("trip").value.trim();
  const box = document.getElementById("result");

  if(!raw){
    box.textContent = "Сначала вставь текст рейса.";
    return;
  }

  const data = parseTrip(raw);
  const rate = Number(document.getElementById("rate").value) || 12000;

  box.replaceChildren();

  const title = document.createElement("h3");
  title.textContent = "Результат: " + data.date;
  box.appendChild(title);

  const summary = document.createElement("div");
  summary.className = "result";

 summary.textContent =
    "Продажа: " + (data.saleTotal === null ? "не указана" : money(data.totalSales)) +
    "\nПрибыль: " + money(data.profit);
  summary.style.whiteSpace = "pre-line";
  box.appendChild(summary);

  const list = document.createElement("div");

  data.items.forEach(item=>{
    const row = document.
createElement("div");
    row.className = "item";
    row.textContent = item.quantity + " × " + item.description +
      " — " + money(item.profit);
    list.appendChild(row);
  });

  box.appendChild(list);

  if(data.mismatch){
    const warning = document.createElement("p");
    warning.className = "danger";
    warning.textContent = "Внимание: сумма категорий (" +
      money(data.totalSales) + ") не совпадает с Тотал (" +
      money(data.saleTotal) + "). Разница: " +
      money(Math.abs(data.saleTotal - data.totalSales));
    box.appendChild(warning);
  }

  if(data.deviceMismatch){
    const warning = document.createElement("p");
    warning.className = "danger";
    warning.textContent = "ВНИМАНИЕ! Продажа аппаратов по моделям: " +
      money(data.deviceSales) + ". Указано в рейсе: " +
      money(data.categorySales.devices || 0) + ". Есть расхождение!";
    box.appendChild(warning);
  }

  if(data.errors.length){
    const warning = document.createElement("div");
    warning.className = "danger";

    const heading = document.createElement("b");
    heading.textContent = "Ошибки — рейс не сохранён:";
    warning.appendChild(heading);

    data.errors.forEach(err=>{
      const p = document.createElement("p");
      p.textContent = "• " + err;
      warning.appendChild(p);
    });

    box.appendChild(warning);
    return;
  }

  const save = document.createElement("button");
  save.textContent = "Сохранить рейс";

  save.onclick = ()=>{
    const history = getHistory();

    history.unshift({
      date: data.date,
      saleTotal: data.totalSales,
      originalTotal: data.saleTotal,
      profit: data.profit,
      rate: rate,
      items: data.items,
      savedAt: new Date().toLocaleString("ru-RU")
    });

    localStorage.setItem(KEY,JSON.stringify(history));
    renderHistory();

    save.textContent = "Сохранено";
    save.disabled = true;
  };

  box.appendChild(save);
}

function addProduct(){
  const name = document.getElementById("productName").value.trim();
  const category = document.getElementById("productCategory").value;
  const profit = Number(document.getElementById("productProfit").value);
  const sale = Number(document.getElementById("productSale").value);

  if(!name || !Number.isFinite(profit) ||  profit <= 0){
    alert("Укажи название товара и прибыль больше нуля.");
    return;
  }

  const products = getProducts();

  if(products.some(p => normalize(p.name) === normalize(name))){
    alert("Такой товар уже существует.");
    return;
  }

  products.push({name, category, profit, sale});

  localStorage.setItem(PRODUCTS_KEY,JSON.stringify(products));

  document.getElementById("productName").value = "";
  document.getElementById("productProfit").value = "";
  document.getElementById("productSale").value = "";

  alert("Товар добавлен!");
}
function renderStats(){
const box = document.getElementById("stats");
const period = document.getElementById("statsPeriod").value;
const history = getHistory();

const now = new Date();
const today = new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()
);

const weekStart = new Date(today);
const day = weekStart.getDay();
weekStart.setDate(weekStart.getDate() - (day === 0 ? 6 : day - 1));

const monthStart = new Date(
now.getFullYear(),
now.getMonth(),
1
);

const filtered = history.filter(trip => {
if(period === "all") return true;

const match = String(trip.savedAt || "").match(
/(\d{1,2})[./](\d{1,2})[./](\d{4})/
);

if(!match) return false;

const tripDate = new Date(
Number(match[3]),
Number(match[2]) - 1,
Number(match[1])
);

if(period === "day") return tripDate >= today;
if(period === "week") return tripDate >= weekStart;
if(period === "month") return tripDate >= monthStart;

return true;
});

const totalProfit = filtered.reduce(
(sum, trip) => sum + Number(trip.profit || 0),
0
);

const totalSales = filtered.reduce(
(sum, trip) => sum + Number(trip.saleTotal || 0),
0
);

const totalUZS = filtered.reduce(
(sum, trip) =>
sum + Number(trip.profit || 0) * Number(trip.rate|| 12000),
0
);

box.innerHTML = "";

const lines = [
"Количество рейсов: " + filtered.length,
"Продажи: " + money(totalSales),
"Общая прибыль: " + money(totalProfit),
"Прибыль в сумах: " +
Math.round(totalUZS).toLocaleString("ru-RU") + " сум"
];

lines.forEach(line => {
const row = document.createElement("div");
row.textContent = line;
row.style.margin = "8px 0";
box.appendChild(row);
});
}
function renderHistory(){
  const box = document.getElementById("history");
  box.replaceChildren();

  const history = getHistory();

  if(!history.length){
    box.textContent = "Пока нет сохранённых рейсов.";
    return;
  }

  history.forEach((trip,index)=>{
    const card = document.createElement("div");
    card.className = "item";

    const title = document.createElement("b");
    title.textContent = trip.date;

    const details = document.createElement("div");
    details.textContent = "Продажа: " + money(trip.saleTotal) +
      " | Total: " + money(trip.originalTotal) +
      " | Прибыль: " + money(trip.profit);

    const del = document.createElement("button");
    del.textContent = "Удалить";
    del.style.background = "#777";

    del.onclick = ()=>{
      const updated = getHistory();
      updated.splice(index,1);
      localStorage.setItem(KEY,JSON.stringify(updated));
      renderHistory();
    };

    const view = document.createElement("button");
    view.textContent = "Подробнее";
    view.style.background = "#2563eb";

    const extra = document.createElement("div");
    extra.style.display = "none";
    extra.style.marginTop = "10px";

    view.onclick = ()=>{
      if(extra.style.display === "none"){
        extra.
replaceChildren();

        const summary = document.createElement("div");
        summary.textContent = "Прибыль в сумах: " +
          Math.round(trip.profit * (trip.rate || 12000)).toLocaleString("ru-RU") + " сум";

        extra.appendChild(summary);

        trip.items.forEach(item=>{
          const line = document.createElement("div");
          line.textContent = item.quantity + " × " +
            item.description + " — " + money(item.profit);
          extra.appendChild(line);
        });

        extra.style.display = "block";
        view.textContent = "Скрыть";

      } else {
        extra.style.display = "none";
        view.textContent = "Подробнее";
      }
    };

    card.append(title,details,view,extra,del);
    box.appendChild(card);
  });
}

renderHistory();
renderStats();
</script>
</body>
</html>
